name: Wachiman review
# Get the key at https://console.anthropic.com and save it as the repository secret ANTHROPIC_API_KEY.
# Pinned to an exact release tag, so a new engine release runs here only after this line is edited
# (ADR 0001 of niway-dev/wachiman). Releases never move a tag, but a repository admin could;
# only a full commit SHA is immutable.
# First install: the installing pull request gets only the automatic review. `/wachiman review` works
# from the next pull request, because `issue_comment` runs from the default branch. Automatic
# thread-reply runs (v1.5.0) need a `pull_request_review_comment` trigger, which this caller does not have.
# This repository is public: the reusable workflow skips fork pull requests on purpose (they get no
# secrets), and only the operator's comment starts an on-demand run.
# The review focus for this repository is in `.github/agent-review.md`.
# Sonnet 5.5 high reviews directly; the optional second-pass verifier is disabled.
# The default caps still bound each run ($0.75 per batch, $3 per review), and all automatic runs
# on one pull request share $6 (`auto_budget_usd`, v1.5.0).
# When the Anthropic API refuses the call (no credit, a rejected key, a persistent rate limit), the
# pull request gets a "Not reviewed" notice and the check passes (`on_provider_unavailable: warn`,
# the default since v1.6.0); set it to `fail` to fail the check instead.
on:
  # `synchronize`: every push to a ready pull request gets an incremental review of what changed
  # since the last reviewed commit (ADR 0028, amendment of 2026-11-01).
  pull_request: { types: [opened, ready_for_review, synchronize] }
  issue_comment: { types: [created] }
permissions: { contents: read, pull-requests: write, issues: read }
jobs:
  review:
    # Temporary pin: an unreleased commit (v1.12.0, the changes merged after it, and the fix of
    # niway-dev/wachiman#194). Move it to the release tag's commit once that fix is released.
    uses: niway-dev/wachiman/.github/workflows/review.yml@fd97f2da761cfb7b0d25b3b4de4227285589bc5f # main + #194, unreleased
    with:
      operator: csdev19
      model: claude-sonnet-5-5
      effort: high
      verify: false
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
